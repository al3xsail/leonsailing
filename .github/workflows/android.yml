name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Caché de Gradle (librerías de Android)
        uses: gradle/actions/setup-gradle@v4

      - name: Dependencias
        run: npm ci

      - name: Copiar la web al proyecto Android
        run: npx cap sync android

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          # Si Maven responde "429 Too Many Requests", espera y reintenta
          for i in 1 2 3; do ./gradlew assembleDebug && break; echo "Reintento $i en 60 s"; sleep 60; done
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TacticaLEON-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TacticaLEON-${{ github.run_number }}
          path: TacticaLEON-${{ github.run_number }}.apk

      - name: Publicar versión descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Táctica LEON 0.1.${{ github.run_number }}
          files: TacticaLEON-${{ github.run_number }}.apk
          body: |
            Instala el APK en el móvil y en la tablet (Android 6 o superior).
            Se instala encima de la versión anterior sin perder el recorrido guardado.
